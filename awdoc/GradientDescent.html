window.gd = {}; // Create a namespace for our gradient descent functions.
window.vars = {}; // Namespaces to store experiment variables.

gd.linval = function(m, c, x) {
  let y = [];
  x.forEach(v => y.push(m * v + c));
  return y;
}

gd.mse = function(a,b) {
  if (a.length != b.length) return 0;
  let sum = 0;
  for (let n = 0; n < a.length; n++) sum += (a[n] - b[n]) ** 2;
  return sum / a.length;
}

gd.update = function(L, x0, x1, func) {
  let y0 = func(x0);
  let y1 = func(x1);
  let x = x0 - L * (y1 - y0) / (x1 - x0);
  return x;
}

Gradient Descent
================

Plot some experimental data and attempt an intial linear fit.

AW{"type":"javascript", "hidden":false}
let x = [    0,  1.1,  1.9,  3.2, 4.4, 5.1,  6.1, 6.9, 7.7, 8.9,10.3];
let y = [-0.95,-0.83, -0.6,-0.45,-0.2,   0, 0.23,0.42,0.58, 0.8,0.96];
plot(x, y);
let m = 0.185;
let c = -0.95;
yfit = gd.linval(m, c, x);
plot(x, yfit);
vars.mse = gd.mse(y, yfit);
vars.x = x;
vars.y = y;

AW{"type":"javascript", "hidden":false}
let str = "MSE = " + JSON.stringify(vars.mse);
print(str);

Plot MSE for range of $c$.

let x = vars.x;
let y = vars.y;
const m = 0.185;
let mse = [];
let c = [];
for (let n = -1; n <= 1; n += 0.001) {
  let cval = 0.1 * n - 0.9;
  mse.push(gd.mse(y, gd.linval(m, cval, x)));
  c.push(cval);
}
plot(c, mse);

AW{"type":"mjmd"}
Update rule
-----------

$$ w_{i,n} = w_{i,n-1} - L \frac{c_{n-2}-c_{n-1}}{w_{i,n-2}-w_{i,n-1}} $$

Find $m$ using update rule.

AW{"type":"javascript", "hidden":false}
let x = vars.x;
let y = vars.y;
const c = -0.9387;
      
function f(m) {
  return gd.mse(y, gd.linval(m, c ,x));
}

let m1 = 1;
let m0 = 0;
let m = [];
let L = 0.005; // Learning rate.
for (let n = 0; n < 100; n++) {
  let mval = gd.update(L, m0, m1, f);
  m1 = m0;
  m0 = mval;
  m.push(mval);
  vars.fit_m = mval;
}

plot(m)

AW{"type":"mjmd"}
Find $c$ using update rule.

AW{"type":"javascript", "hidden":false}
let x = vars.x;
let y = vars.y;
const m = vars.fit_m;;

function f(c) {
  return gd.mse(y, gd.linval(m, c ,x));
}

let c1 = 1;
let c0 = 0;
let c = [];
let L = 0.05; // Learning rate.
for (let n = 0; n < 100; n++) {
  let cval = gd.update(L, c0, c1, f);
  c1 = c0;
  c0 = cval;
  c.push(cval);
  vars.fit_c = cval;
}

plot(c)

AW{"type":"javascript", "hidden":false}
let str = "MSE = " + JSON.stringify(gd.mse(vars.y, gd.linval(vars.fit_m, vars.fit_c, vars.x)));
print(str);
