window.gd = {}; // Create a namespace for our gradient descent functions.
window.vars = {}; // Namespaces to store experiment variables.

gd.linval = function(m, c, x) {
  let y = [];
  x.forEach(v => y.push(m * v + c));
  return y;
}

gd.mse = function(a,b) {
  console.log({a,b});
  if (a.length != b.length) return 0;
  let sum = 0;
  for (let n = 0; n < a.length; n++) sum += (a[n] - b[n]) ** 2;
  return sum / a.length;
}
